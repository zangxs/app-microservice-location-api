name: CI/CD

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install common-dto-library
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/zangxs/common-dto-library.git
          cd common-dto-library
          mvn clean install -DskipTests

      - name: Ejecutar tests con Maven
        run: mvn test

      - name: Generar informe de Cobertura
        run: mvn site

      - name: Publicar informe en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/index.html
